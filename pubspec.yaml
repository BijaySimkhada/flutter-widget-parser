name: dynamic_widget_parser
description: >
  A production-grade, security-first dynamic Flutter widget parser for
  server-driven UI. Converts a controlled Flutter-like DSL string (or JSON)
  into a real Flutter widget tree via a lexer/parser/AST pipeline, without
  executing arbitrary Dart code.
version: 0.1.0
homepage: https://example.com/dynamic_widget_parser
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
